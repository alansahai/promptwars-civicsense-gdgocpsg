[project]
name = "civicresolve"
version = "1.0.0"
description = "AI-Powered Citizen Grievance Management and Resolution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "google-genai==1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
    "PL",   # pylint
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function call in argument defaults (standard in FastAPI Depends)
    "PLR2004", # magic value used in comparison
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert allowed in tests
    "S105",    # hardcoded passwords/tokens in tests
    "S106",    # hardcoded passwords in test calls
    "ARG001",  # unused fixture arguments
    "ARG002",  # unused method arguments in mocks
    "PLR0913", # tests may take multiple fixtures
    "PLR0915", # test functions may have many assertion statements
    "S311",    # pseudo-random generators in test data
]
"scripts/*" = [
    "S101",
    "T201",
    "PLR0915",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "tests",
    "scripts",
]
